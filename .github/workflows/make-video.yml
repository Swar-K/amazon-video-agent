name: Make video

on:
  workflow_dispatch:
    inputs:
      asin:
        description: "Project folder name under projects/ (a product ASIN, or a comparison folder)"
        required: true
      mode:
        description: "script = write script.md | render = build the mp4 | all = both | scenes = plan AI clip scenes | preview = sample picture of all 5 templates"
        type: choice
        default: script
        options: [script, render, all, scenes, preview]
      length:
        description: "auto = by video type (review ~5 min, comparison/list ~7.5 min, always under 9) | short = 1.5-4.8 min"
        type: choice
        default: auto
        options: [auto, short]
      template:
        description: "Visual template (render/all): best = modern, one = clean minimal, two = bold vibrant, three = dark cinematic, four = modern glass"
        type: choice
        default: best
        options: [best, one, two, three, four]
      voice:
        description: "Narration voice"
        type: choice
        default: inworld_female
        options:
          - eleven_female
          - eleven_female_2
          - eleven_male
          - eleven_male_2
          - edge_female
          - edge_female_2
          - edge_male
          - edge_male_2
          - openai_female
          - openai_male
          - inworld_female
          - inworld_male
          - openrouter_voxtral
      allow_inworld_paid_tts:
        description: "Allow paid Inworld usage after the configured safety allowance (also requires config opt-in)"
        type: boolean
        default: false
      allow_paid_tts:
        description: "Allow usage-billed OpenRouter TTS for this run (also requires config opt-in)"
        type: boolean
        default: false
      angle:
        description: "Video angle (blank = automatic rotation)"
        type: choice
        default: ""
        options: ["", first_impressions, who_its_for, problem_solution, buyers_checklist, day_in_the_life, honest_pros_cons, gift_angle]
      preview_seconds:
        description: "Render only the first N seconds as a quick preview (0 = full video)"
        default: "0"
      force:
        description: "Overwrite an existing script.md / ignore the daily limit"
        type: boolean
        default: false

# Serialize runs because the Inworld lifetime-usage ledger is shared across products.
concurrency:
  group: summer-section-video-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ASIN: ${{ inputs.asin }}
      MODE: ${{ inputs.mode }}
      LENGTH: ${{ inputs.length }}
      TEMPLATE: ${{ inputs.template }}
      VOICE: ${{ inputs.voice }}
      ANGLE: ${{ inputs.angle }}
      PREVIEW: ${{ inputs.preview_seconds }}
      FORCE: ${{ inputs.force }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
      INWORLD_ALLOW_PAID_TTS: ${{ inputs.allow_inworld_paid_tts }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_ALLOW_PAID_TTS: ${{ inputs.allow_paid_tts }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate ASIN
        run: |
          ASIN="$(printf '%s' "$ASIN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"   # trim stray spaces
          ASIN="${ASIN#projects/}"; ASIN="${ASIN%/}"                                              # allow "projects/NAME/"
          echo "Project name received: [$ASIN]"
          [[ "$ASIN" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{2,39}$ ]] || { echo "Project name [$ASIN] is not valid: use 3-40 letters, digits, - or _ (no spaces, slashes, dots or commas), exactly like the folder name under projects/"; exit 1; }
          # keep the case you typed (Linux folders are case-sensitive); fall back to upper case for ASINs typed in lower case
          if [ ! -d "projects/$ASIN" ]; then UP=$(echo "$ASIN" | tr a-z A-Z); if [ -d "projects/$UP" ]; then ASIN="$UP"; fi; fi
          echo "ASIN=$ASIN" >> "$GITHUB_ENV"
          [ -d "projects/$ASIN" ] || { echo "Folder projects/$ASIN not found. Check the spelling against the folders in your repo."; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg, fonts, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Restore saved photo checks and voice lines (all projects)
        uses: actions/cache/restore@v4
        with:
          path: |
            projects/*/.cache
            .adagent_state/tts_usage.json
          key: adagent-cache-${{ github.run_id }}
          restore-keys: adagent-cache-

      - name: Run
        id: run
        run: |
          set -o pipefail
          args=("$MODE" "$ASIN")
          if [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then args+=(--voice "$VOICE"); fi
          if [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then if [ -n "$TEMPLATE" ]; then args+=(--template "$TEMPLATE"); fi; fi
          if [ "$MODE" = "script" ] || [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then if [ -n "$LENGTH" ]; then args+=(--length "$LENGTH"); fi; fi
          if [ "$MODE" = "script" ] || [ "$MODE" = "all" ]; then
            if [ -n "$ANGLE" ]; then args+=(--angle "$ANGLE"); fi
          fi
          if [ "$MODE" = "script" ] || [ "$MODE" = "all" ] || [ "$MODE" = "scenes" ]; then if [ "$FORCE" = "true" ]; then args+=(--force); fi; fi
          if [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; then
            if [ "$PREVIEW" != "0" ] && [ -n "$PREVIEW" ]; then args+=(--max-seconds "$PREVIEW"); fi
          fi
          python -u -m adagent "${args[@]}" 2>&1 | tee run.log

      - name: Show the result on the run summary page
        if: always()
        run: |
          {
            echo "### Video agent log (last 60 lines)"
            echo '```'
            tail -n 60 run.log 2>/dev/null || echo "(no log was written)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # put the real reason into the red Annotations box instead of only "exit code 1"
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            msg=$(grep -v '^[[:space:]]*$' run.log 2>/dev/null | tail -n 4 | tr '\n' ' ' | cut -c1-900)
            if [ -n "$msg" ]; then echo "::error title=Video agent stopped::${msg}"; fi
          fi

      - name: Save photo checks and voice lines (also after a failed run)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            projects/*/.cache
            .adagent_state/tts_usage.json
          key: adagent-cache-${{ github.run_id }}

      - name: Check the video files are not damaged
        if: always()
        run: |
          # a half-written silent video from a failed run must never be uploaded
          rm -f "projects/$ASIN/out/_video_only.mp4"
          echo "Files in projects/$ASIN/out right now:"; ls -la "projects/$ASIN/out" 2>/dev/null || echo "(no out folder)"
          for f in projects/"$ASIN"/out/*.mp4; do
            [ -e "$f" ] || continue
            if ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" >/dev/null 2>&1; then
              echo "OK $(du -h "$f" | cut -f1)  $f"
            else
              echo "::error::$f is damaged, removing it so you do not download a broken file"; rm -f "$f"
            fi
          done
          if { [ "$MODE" = "render" ] || [ "$MODE" = "all" ]; } && [ "${{ steps.run.outcome }}" = "success" ] && ! ls projects/"$ASIN"/out/*.mp4 >/dev/null 2>&1; then
            echo "::error::The render finished but there is no .mp4 in projects/$ASIN/out, so the artifact will have no video."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASIN }}-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            projects/${{ env.ASIN }}/out/*.mp4
            projects/${{ env.ASIN }}/out/*.png
            projects/${{ env.ASIN }}/out/*.txt
            projects/${{ env.ASIN }}/out/*.md
            run.log
          compression-level: 0       # mp4 is already compressed; storing it as-is makes the zip faster and easier to open
          retention-days: 3          # short on purpose: the free plan has only 500 MB of artifact storage, download your video soon
          if-no-files-found: ignore

      - name: Save script, footage choices and history
        # always(): if the render fails after the script was written (for example a policy flag), the script is still saved to the
        # repo, so you can edit projects/<ASIN>/script.md and run mode=render instead of it being lost with the run.
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/keep && mkdir -p /tmp/keep/scripts_archive /tmp/keep/state
          if [ "$MODE" != "render" ] && [ "$MODE" != "scenes" ] && [ -f "projects/$ASIN/script.md" ]; then cp "projects/$ASIN/script.md" /tmp/keep/script.md; fi
          if [ "$MODE" = "scenes" ] && [ -f "projects/$ASIN/scenes.md" ]; then cp "projects/$ASIN/scenes.md" /tmp/keep/scenes.md; fi
          # the footage picked for this video (script/all) and the per-product memory of which footage videos used (after a render)
          if [ "$MODE" = "script" ] || [ "$MODE" = "all" ]; then
            if [ -f "projects/$ASIN/selection.json" ]; then cp --parents "projects/$ASIN/selection.json" /tmp/keep/state/; fi
          fi
          for f in projects/*/asset_usage.json; do
            if [ -f "$f" ]; then cp --parents "$f" /tmp/keep/state/; fi
          done
          # the Inworld usage ledger (lifetime character count) must survive the reset below
          if [ -f .adagent_state/tts_usage.json ]; then cp --parents .adagent_state/tts_usage.json /tmp/keep/state/; fi
          cp -r scripts_archive/. /tmp/keep/scripts_archive/ 2>/dev/null || true
          git config user.name "adagent"
          git config user.email "adagent@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            if [ -f /tmp/keep/script.md ]; then cp /tmp/keep/script.md "projects/$ASIN/script.md"; fi
            if [ -f /tmp/keep/scenes.md ]; then cp /tmp/keep/scenes.md "projects/$ASIN/scenes.md"; fi
            cp -r /tmp/keep/state/. . 2>/dev/null || true
            mkdir -p scripts_archive && cp -r /tmp/keep/scripts_archive/. scripts_archive/ 2>/dev/null || true
            # one file at a time: a single missing file used to make 'git add' stage NOTHING
            for f in "projects/$ASIN/script.md" "projects/$ASIN/scenes.md" "projects/$ASIN/selection.json" projects/*/asset_usage.json scripts_archive .adagent_state/tts_usage.json; do
              if [ -e "$f" ]; then git add -- "$f"; fi
            done
            if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
            git commit -qm "script/history for $ASIN"
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            sleep 5
          done
          exit 1
